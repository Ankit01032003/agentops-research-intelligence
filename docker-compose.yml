services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentops-api
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/data/chroma
      HISTORY_DB_PATH: /app/data/research_history.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - agentops_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentops-frontend
    env_file:
      - .env
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  agentops_data:
